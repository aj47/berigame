<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Flint Knife item icon: hand-drawn source for frontend/public/items/flint_knife.png (render at 128x128, transparent). A short driftwood handle with a long knapped flint blade lashed on with cord. -->
  <defs>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0CDAE"/>
      <stop offset="0.55" stop-color="#B69E7D"/>
      <stop offset="1" stop-color="#85705A"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A9AB0"/>
      <stop offset="0.5" stop-color="#55657C"/>
      <stop offset="1" stop-color="#2F3A4C"/>
    </linearGradient>
  </defs>
  <g stroke="#2A2420" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle -->
    <path d="M16 116 C 10 111, 11 104, 17 99 L 46 70 C 50 66, 57 66, 60 70 C 63 74, 62 80, 58 84 L 29 113 C 25 117, 20 120, 16 116 Z" fill="url(#haft)" stroke-width="4.5"/>
    <!-- blade: a long leaf-shaped flake -->
    <path d="M50 64 L 70 40 L 96 18 L 116 10 L 110 30 L 90 58 L 66 80 Z" fill="url(#stone)" stroke-width="4.5"/>
  </g>
  <g fill="none" stroke="#1C2230" stroke-width="1.8" stroke-linejoin="round" opacity="0.8">
    <path d="M60 70 L 88 42 L 112 16"/>
    <path d="M72 50 L 80 58"/>
    <path d="M86 36 L 94 44"/>
  </g>
  <path d="M62 60 L 94 26 L 112 14" stroke="#EEF3FA" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- cord lashing -->
  <g stroke="#3A2211" stroke-width="1.6" fill="#C9934E" stroke-linejoin="round">
    <path d="M44 72 L 56 84 L 60 80 L 48 68 Z"/>
    <path d="M39 77 L 51 89 L 55 85 L 43 73 Z"/>
  </g>
  <path d="M22 102 L 38 86" fill="none" stroke="#F4EAD6" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="19" cy="112" rx="6" ry="7.5" transform="rotate(-45 19 112)" fill="#DCCAA8" stroke="#2A2420" stroke-width="3"/>
  <path d="M26 34 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" fill="#FFE27A" stroke="#C99A2E" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
