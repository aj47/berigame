<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Berry Mash item icon: hand-drawn source for frontend/public/items/berry_mash.png (render at 128x128, transparent). A half coconut-shell bowl heaped with mashed red and green berries. -->
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6A42"/>
      <stop offset="1" stop-color="#5E3D24"/>
    </linearGradient>
    <radialGradient id="mash" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F07A92"/>
      <stop offset="0.6" stop-color="#C2405E"/>
      <stop offset="1" stop-color="#8E2A44"/>
    </radialGradient>
  </defs>
  <!-- heap of mash -->
  <path d="M22 70 C 20 50, 40 34, 64 34 C 88 34, 108 50, 106 70 Z" fill="url(#mash)" stroke="#2A2420" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- whole berries on top -->
  <circle cx="48" cy="48" r="9" fill="#EF4444" stroke="#2A2420" stroke-width="3"/>
  <circle cx="72" cy="44" r="8" fill="#22C55E" stroke="#2A2420" stroke-width="3"/>
  <circle cx="86" cy="56" r="7" fill="#22C55E" stroke="#2A2420" stroke-width="3"/>
  <circle cx="45" cy="45" r="2.6" fill="#FFD3D3"/>
  <circle cx="70" cy="41" r="2.4" fill="#D6FFD9"/>
  <path d="M34 60 C 42 56, 50 62, 58 58 C 66 54, 74 62, 92 60" fill="none" stroke="#FFB3C2" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- coconut-shell bowl -->
  <path d="M14 68 L 114 68 C 112 94, 92 110, 64 110 C 36 110, 16 94, 14 68 Z" fill="url(#bowl)" stroke="#2A2420" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M24 78 C 30 92, 44 100, 60 102" fill="none" stroke="#C49468" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <g stroke="#3E2816" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M40 84 l 4 8"/><path d="M62 88 l 1 9"/><path d="M84 84 l -3 8"/>
  </g>
  <path d="M104 26 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" fill="#FFE27A" stroke="#C99A2E" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
