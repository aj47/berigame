  </defs>
  <g stroke="#0B0812" stroke-linejoin="round" stroke-linecap="round">
    <path d="M58 8 L 92 30 L 108 72 L 84 118 L 42 114 L 20 78 L 30 36 Z" fill="url(#glass)" stroke-width="4.5"/>
  </g>
  <!-- conchoidal facets -->
